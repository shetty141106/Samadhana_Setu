<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | SamadhanSetu</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --jh-green-900: #0B3D2E;
      --jh-green-800: #134e3a;
      --jh-gold: #F2C94C;
      --jh-gold-dark: #D4AF37;
      --jh-charcoal: #1C2826;
      --jh-earth-800: #3D342B;
      --jh-earth-600: #6E5F4D;
      --jh-earth-400: #B4A28A;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background: var(--jh-charcoal);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      color: white;
    }
    .container { max-width: 560px; }
    .error-code {
      font-size: 9rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--jh-green-800), var(--jh-green-900));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      user-select: none;
    }
    h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 1rem; }
    p { color: var(--jh-earth-400); font-size: 1.15rem; line-height: 1.6; margin-bottom: 2.5rem; }

    .buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 14px 32px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.3s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--jh-gold), var(--jh-gold-dark));
      color: var(--jh-green-900);
      box-shadow: 0 8px 25px rgba(242,201,76,0.25);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(242,201,76,0.35); }
    .btn-secondary {
      background: var(--jh-earth-800);
      color: white;
      border: 1px solid var(--jh-earth-600);
    }
    .btn-secondary:hover { background: #4a4035; }

    .footer {
      margin-top: 4rem;
      color: var(--jh-earth-600);
      font-size: 0.9rem;
    }

    @media (max-width: 500px) {
      .error-code { font-size: 6.5rem; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p>The page you’re looking for doesn’t exist or has been moved.<br>Let’s get you back to solving real problems in Jharkhand.</p>

    <div class="buttons">
      <a href="/frontend/Authentication/Sign-in.html" class="btn btn-primary">Go to Homepage</a>
      <a href="/frontend/Authentication/Sign-in.html" class="btn btn-secondary">Sign In</a>
    </div>

    <div class="footer">SamadhanSetu • Built for Jharkhand</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | SamadhanSetu</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --jh-green-900: #0B3D2E;
      --jh-green-700: #1B5E3B;
      --jh-gold: #F2C94C;
      --jh-gold-dark: #D4AF37;
      --jh-charcoal: #1C2826;
      --jh-earth-900: #28221C;
      --jh-earth-700: #534739;
      --jh-earth-400: #B4A28A;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; background: var(--jh-charcoal); }

    .left-panel {
      width: 50%; position: relative; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 3rem; color: white;
    }
    .left-panel::before {
      content: ''; position: absolute; inset: 0;
      background: url('https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=2070') center/cover no-repeat;
    }
    .left-panel::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(11,61,46,0.8) 0%, rgba(11,61,46,0.65) 50%, rgba(11,61,46,0.92) 100%);
    }
    .left-content { position: relative; z-index: 2; }
    .logo { display: flex; align-items: center; gap: 12px; font-size: 1.6rem; font-weight: 700; }
    .logo-icon {
      width: 42px; height: 42px; background: var(--jh-gold); color: var(--jh-green-900);
      border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.4rem;
    }
    .hero-text h1 { font-size: 3rem; font-weight: 800; line-height: 1.2; margin-bottom: 1.2rem; }
    .hero-text h1 span { color: var(--jh-gold); }
    .hero-text p { font-size: 1.15rem; opacity: 0.9; max-width: 400px; line-height: 1.6; }

    .right-panel {
      width: 50%; display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .form-container { width: 100%; max-width: 420px; }
    .form-container h2 { font-size: 2rem; font-weight: 700; color: white; margin-bottom: 0.5rem; }
    .form-container > p { color: var(--jh-earth-400); margin-bottom: 2rem; }

    input {
      width: 100%; padding: 15px 18px; border-radius: 14px; border: 1px solid var(--jh-earth-700);
      background: var(--jh-earth-900); color: white; font-size: 1rem; outline: none; margin-bottom: 1.5rem;
      transition: all 0.25s;
    }
    input:focus { border-color: var(--jh-green-700); box-shadow: 0 0 0 3px rgba(27,94,59,0.25); }
    input::placeholder { color: var(--jh-earth-400); }

    .submit-btn {
      width: 100%; padding: 16px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, var(--jh-gold), var(--jh-gold-dark));
      color: var(--jh-green-900); font-size: 1.05rem; font-weight: 700; cursor: pointer;
      transition: all 0.3s; box-shadow: 0 8px 25px rgba(242,201,76,0.25);
    }
    .submit-btn:hover { transform: translateY(-2px); }

    .bottom-text { text-align: center; margin-top: 2rem; color: var(--jh-earth-400); }
    .bottom-text a { color: var(--jh-gold); font-weight: 600; text-decoration: none; }

    @media (max-width: 992px) { .left-panel { display: none; } .right-panel { width: 100%; } }
  </style>
</head>
<body>
  <div class="left-panel">
    <div class="left-content">
      <div class="logo">
        <div class="logo-icon">S</div>
        <span>SamadhanSetu</span>
      </div>
    </div>
    <div class="left-content hero-text">
      <h1>Don’t worry.<br><span>We’ll help you back.</span></h1>
      <p>Enter your email and we’ll send you a secure link to reset your password.</p>
    </div>
    <div class="left-content" style="opacity:0.7;font-size:0.9rem;">
      Secure • Encrypted • Jharkhand-first
    </div>
  </div>

  <div class="right-panel">
    <div class="form-container">
      <h2>Reset your password</h2>
      <p>Enter the email associated with your account.</p>

      <input type="email" placeholder="Email address" id="email">

      <button class="submit-btn" onclick="handleReset()">Send Reset Link</button>

      <p class="bottom-text">
        Remembered your password? <a href="/frontend/Authentication/Sign-in.html">Back to Sign In</a>
      </p>
    </div>
  </div>

  <script>
    function handleReset() {
      const email = document.getElementById('email').value;
      if (!email) {
        alert('Please enter your email');
        return;
      }
      alert('Reset link sent to ' + email + '\nPlease check your inbox.');
    }
  </script>
</body>
</html>

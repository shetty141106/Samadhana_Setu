# ===============================
# APPLICATION
# ===============================
spring.application.name=samadhansetu

# ===============================
# SERVER
# ===============================
# Render provides PORT at runtime; keep 8080 for local development.
server.port=${PORT:8080}

# ===============================
# MYSQL / TiDB CLOUD DATABASE
# ===============================
# TiDB Cloud Serverless requires TLS. Java can use the system CA store,
# so no CA file needs to be committed to the repository.
# Override these values in Render with environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/samadhansetu}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JSON
# ===============================
spring.jackson.serialization.fail-on-empty-beans=false

# ===============================
# JWT
# ===============================
# Never commit the real production secret. Render/local environments must provide it.
app.jwt.secret=${JWT_SECRET:change-me-development-secret-at-least-32-characters}

# ===============================
# CORS
# ===============================
# Comma-separated frontend origins. Override in Render for the deployed frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# ===============================
# AI BRIDGE
# ===============================
# Python/FastAPI endpoint. Override with AI_SERVICE_URL in deployment.
ai.service.url=${AI_SERVICE_URL:http://localhost:8000/api/v1/analyze}
